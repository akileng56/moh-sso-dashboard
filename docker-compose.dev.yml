version: "3.9"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    container_name: keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_HOSTNAME: http://localhost:8081
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_HTTPS: false
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8081:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/master"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - sso_network

  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    networks:
      - sso_network

  redis:
    image: redis:7-alpine
    container_name: cache
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend-db:
    image: postgres:15
    container_name: backend-db
    environment:
      POSTGRES_DB: sso_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - backend_data:/var/lib/postgresql/data
    networks:
      - sso_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sso-backend
    environment:
      - PORT=9000
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=moh-realm
      - KEYCLOAK_CLIENT_ID=dashboard
      - KEYCLOAK_REDIRECT_URI=http://localhost:9000/api/v1/auth/callback
      - KEYCLOAK_CLIENT_SECRET=U2FsdGVkX19T2cV2PfUkkEIwdGnJICQXma6zEe+yTig=
      - DB_HOST=backend-db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=sso_dashboard
    depends_on:
      keycloak:
        condition: service_healthy
      backend-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    networks:
      - sso_network
    volumes:
      - ./backend:/app
    command: sh -c "go run ./cmd/server"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sso-frontend
    environment:
      - VITE_API_URL=http://localhost:9000
      - VITE_KEYCLOAK_URL=http://localhost:8081
      - VITE_KEYCLOAK_REALM=moh-realm
      - VITE_KEYCLOAK_CLIENT_ID=dashboard
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - sso_network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  keycloak_data:
  backend_data:

networks:
  sso_network:
    driver: bridge
