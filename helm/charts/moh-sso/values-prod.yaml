# ===============================
# Production values
# ===============================

global:
  namespace: sso-prod

ingress:
  enabled: true
  className: nginx
  host: sso.moh.go.ug
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
  tls:
    enabled: true
    secretName: sso-prod-tls

# -------------------------------
# Backend API
# -------------------------------
api:
  enabled: true
  image:
    repository: moh-sso/sso-api
    tag: prod # overridden by CI/CD
    pullPolicy: IfNotPresent

  replicas: 3

  env:
    PORT: "9000"
    ALLOWED_ORIGINS: "https://sso.moh.go.ug"

  secrets:
    JWT_SECRET: prod-rotate-me
    DB_DSN: "" # auto-generated in template

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  pdb:
    enabled: true
    minAvailable: 2

# -------------------------------
# Frontend
# -------------------------------
frontend:
  enabled: true
  image:
    repository: moh-sso/sso-frontend
    tag: prod # overridden by CI/CD
    pullPolicy: IfNotPresent

  replicas: 3

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  pdb:
    enabled: true
    minAvailable: 2

# -------------------------------
# Application Postgres
# -------------------------------
postgresApp:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine

  auth:
    db: sso
    user: sso_user
    password: prod_app_db_password

  persistence:
    enabled: true
    size: 50Gi
    accessModes: ["ReadWriteOnce"]

# -------------------------------
# Keycloak + DB
# -------------------------------
postgresKeycloak:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine

  auth:
    db: keycloak
    user: keycloak_user
    password: prod_keycloak_db_password

  persistence:
    enabled: true
    size: 50Gi
    accessModes: ["ReadWriteOnce"]

keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: 26.0.6

  replicas: 2

  admin:
    username: admin
    password: prod-keycloak-admin-rotate

  config:
    KC_DB: postgres
    KC_HTTP_ENABLED: "true"
    KC_PROXY: edge
    KC_HOSTNAME_STRICT: "true"
    KC_HOSTNAME_STRICT_HTTPS: "true"
    KC_LOG_LEVEL: INFO
