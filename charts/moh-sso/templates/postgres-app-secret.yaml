{{- if .Values.postgresApp.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app-db
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgresApp.auth.db | quote }}
  POSTGRES_USER: {{ .Values.postgresApp.auth.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresApp.auth.password | quote }}
{{- end }}
