# ===============================
# Production values (CI-safe)
# ===============================

global:
  namespace: sso-prod

ingress:
  enabled: true
  className: nginx
  host: sso.moh.go.ug
  tls:
    enabled: true
    secretName: sso-prod-tls

# -------------------------------
# Backend API
# -------------------------------
backend:
  enabled: true

  image:
    repository: "" # injected by CI
    tag: "" # injected by CI
    pullPolicy: IfNotPresent

  replicas: 3

  env:
    PORT: "9000"
    ALLOWED_ORIGINS: "https://sso.moh.go.ug"

  secrets:
    JWT_SECRET: prod-rotate-me
    DB_DSN: "" # auto-generated in template

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  pdb:
    enabled: true
    minAvailable: 2

# -------------------------------
# Frontend
# -------------------------------
frontend:
  enabled: true

  image:
    repository: "" # injected by CI
    tag: "" # injected by CI
    pullPolicy: IfNotPresent

  replicas: 3

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  pdb:
    enabled: true
    minAvailable: 2

# -------------------------------
# Application Postgres
# -------------------------------
postgresApp:
  enabled: true
  auth:
    db: sso
    user: sso_user
    password: prod_app_db_password

  persistence:
    enabled: true
    size: 50Gi

# -------------------------------
# Keycloak
# -------------------------------
postgresKeycloak:
  enabled: true
  auth:
    db: keycloak
    user: keycloak_user
    password: prod_keycloak_db_password

  persistence:
    enabled: true
    size: 50Gi

keycloak:
  enabled: true
  replicas: 2

  admin:
    username: admin
    password: prod-keycloak-admin-rotate

  config:
    KC_LOG_LEVEL: INFO
