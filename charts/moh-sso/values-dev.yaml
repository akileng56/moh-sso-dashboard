# ===============================
# Development values (CI-safe)
# ===============================

global:
  namespace: sso-dev

ingress:
  enabled: true
  className: nginx
  host: sso-dev.moh.go.ug
  tls:
    enabled: true
    secretName: sso-dev-tls

# -------------------------------
# Backend API
# -------------------------------
backends:
  enabled: true

  image:
    repository: "" # injected by CI
    tag: "" # injected by CI
    pullPolicy: IfNotPresent

  replicas: 1

  env:
    PORT: "9000"
    ALLOWED_ORIGINS: "https://sso-dev.moh.go.ug"

  secrets:
    JWT_SECRET: dev-change-me
    DB_DSN: "" # auto-generated in template

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

  hpa:
    enabled: false

  pdb:
    enabled: false

# -------------------------------
# Frontend
# -------------------------------
frontend:
  enabled: true

  image:
    repository: "" # injected by CI
    tag: "" # injected by CI
    pullPolicy: IfNotPresent

  replicas: 1

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 256Mi

  hpa:
    enabled: false

  pdb:
    enabled: false

# -------------------------------
# Application Postgres
# -------------------------------
postgresApp:
  enabled: true
  auth:
    db: sso
    user: sso_user
    password: dev_app_db_password

  persistence:
    enabled: true
    size: 5Gi

# -------------------------------
# Keycloak
# -------------------------------
postgresKeycloak:
  enabled: true
  auth:
    db: keycloak
    user: keycloak_user
    password: dev_keycloak_db_password

  persistence:
    enabled: true
    size: 5Gi

keycloak:
  enabled: true
  replicas: 1

  admin:
    username: admin
    password: dev-keycloak-admin

  config:
    KC_LOG_LEVEL: DEBUG
