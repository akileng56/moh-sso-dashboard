name: Build, Push & Deploy (Kubernetes)

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_REPO: ${{ github.event.repository.name }}
  HELM_RELEASE: moh-sso

jobs:
  # =====================================
  # BUILD & PUSH IMAGES
  # =====================================
  docker-build-push:
    name: Build, Test & Push Docker Images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.sha.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag (short SHA)
        id: sha
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # -------------------------------
      # Multi-arch setup
      # -------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------
      # Login to GHCR
      # -------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------
      # Backend image metadata
      # -------------------------------
      - name: Extract backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPO }}-backend
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # -------------------------------
      # Frontend image metadata
      # -------------------------------
      - name: Extract frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPO }}-frontend
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # -------------------------------
      # Backend image
      # -------------------------------
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # -------------------------------
      # Frontend image
      # -------------------------------
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  # =====================================
  # DEPLOY TO DEV (AUTO)
  # =====================================
  deploy-dev:
    name: Deploy to Dev (Kubernetes)
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    environment:
      name: dev

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Configure kubeconfig (Dev)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster access
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Deploy via Helm (Dev)
        run: |
          helm upgrade --install $HELM_RELEASE charts/moh-sso \
            -n sso-dev \
            --create-namespace \
            -f charts/moh-sso/values-dev.yaml \
            --set backend.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPO }}-backend \
            --set backend.image.tag=${{ needs.docker-build-push.outputs.image_tag }} \
            --set frontend.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPO }}-frontend \
            --set frontend.image.tag=${{ needs.docker-build-push.outputs.image_tag }} \
            --wait \
            --timeout 5m

  # =====================================
  # DEPLOY TO PROD (TAG + APPROVAL)
  # =====================================
  deploy-prod:
    name: Deploy to Production (Kubernetes)
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Configure kubeconfig (Prod)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster access
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Deploy via Helm (Prod)
        run: |
          helm upgrade --install $HELM_RELEASE charts/moh-sso \
            -n sso-prod \
            --create-namespace \
            -f charts/moh-sso/values-prod.yaml \
            --set backend.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPO }}-backend \
            --set backend.image.tag=${{ needs.docker-build-push.outputs.image_tag }} \
            --set frontend.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPO }}-frontend \
            --set frontend.image.tag=${{ needs.docker-build-push.outputs.image_tag }} \
            --wait \
            --timeout 10m
